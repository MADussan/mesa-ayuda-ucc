# Blueprint de Render: construye la imagen desde el Dockerfile del repositorio.
services:
  - type: web
    name: mesa-ayuda
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /salud
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: NODE_ENV
        value: production
